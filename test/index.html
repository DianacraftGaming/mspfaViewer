<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="./uhcstyle.css">
  <link rel="stylesheet" href="./themes.css">
  <script src="../mspfaViewer.js"></script>

  <style id="adventureStyle"></style>
</head>
<body>
  <div class="main">
    <div class="pageBody">
      <nav class="navBanner customNavBanner pixelated">
        <div id="banner"></div>
        <div class="navList">
          <a href="/" id="home">HOME</a> 
          <div class="candyCorn"></div>
          <!-- <a href="/help" id ="help">HELP</a> 
          <div class="candyCorn"></div>-->
          <a href="?p=map" id="map">MAP</a> 
          <div class="sep">|</div> 
          <a href="?p=log" id ="log">LOG</a> 
          <!-- <div class="sep">|</div>
          <a href="/search" id="search">SEARCH</a> 
          <div class="candyCorn"></div>
          <a href="/news" id="news">NEWS</a> 
          <div class="sep">|</div>
          <a href="/music" id="music">MUSIC</a> 
          <div class="candyCorn"></div>
          <a href="/evenmore" id="evenmore">MORE</a> 
          <div class="sep">|</div>
          <a href="/settings" id="settings">SETTINGS</a> 
          <div class="sep">|</div>
          <a href="/credits" id="credits">CREDITS</a>  -->
        </div>
      </nav>
      <div class="pageFrame">

        <div class="dualWrapper">
        
          <div class="pageContent">
            <div id="command1"></div>
            <div class="story-text">
              <div id="content1"></div>

              <div class="bottomLinks"> 
                <div>
                  <a href="?p=1">Start Over</a> 
                  <span id="gobackbar1"> | </span> 
                  <a id="goback1">Go Back</a> 
                </div>
                <div id="timestamp1">
                  
                </div>
              </div>
            </div>
          </div>

          <div class="pageContent">
            <div id="command2"></div>
            <div class="story-text">
              <div id="content2"></div>

              <div class="bottomLinks"> 
                <div>
                  <a href="?p=1">Start Over</a> 
                  <span id="gobackbar2"> | </span> 
                  <a id="goback2">Go Back</a> 
                </div>
                <div id="timestamp2">
                  
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="pageContent">
          <div id="command"></div>
          <div class="story-text">
            <div id="adventuremap"></div>
            <div id="content"></div>
            <div id="links"></div>

            <div class="bottomLinks"> 
              <div>
                <a href="?p=1">Start Over</a> 
                <span id="gobackbar"> | </span> 
                <a id="goback">Go Back</a> 
              </div>
              <div id="timestamp">
                
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="footer">
        <a href="/"><div class="bannerImage left"></div></a>
        <a href="/"><div class="bannerImage right"></div></a>
      </div>

  <div id="prelaod" style="display: none;"></div>
